# Revision diaria de los modelos de CIRCLE: copia propia entera, revision nueva en el origen, prueba con sherpa-onnx
# y resultado en estado.json. NUNCA publica ni cambia la ficha: eso es el workflow manual Promover modelo, despues de que
# el Fundador prueba el modelo en persona y lo acepta. Ver README.md. Sin secretos propios: usa el GITHUB_TOKEN.
name: Actualizar modelos

on:
  schedule:
    - cron: '17 9 * * *'   # 05:17 de Bolivia, todos los dias
  workflow_dispatch: {}

permissions:
  contents: write          # guardar estado.json

concurrency:
  group: actualizar-modelos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: herramientas/requirements.txt

      - name: Dependencias (sherpa-onnx 2.0.1, la misma version que la app)
        run: pip install -r herramientas/requirements.txt

      - name: Revisar el origen y probar lo nuevo (no publica)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python herramientas/actualizar.py

      - name: Guardar estado.json y modelos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Revision diaria de modelos: $(python -c "import json;print(json.load(open('estado.json',encoding='utf-8'))['resumen'][:120])")"
          git push
